openapi: 3.1.0
info:
  title: U.S. Election Assistance Commission Content JSON:API
  version: '1.0'
  summary: Anonymous, read-only JSON:API 1.0 over the EAC's public content estate at www.eac.gov — voting
    system certifications, test labs, manufacturers, NVRA state pages, HAVA grant financials and the Clearinghouse
    Awards.
  description: 'The U.S. Election Assistance Commission publishes no developer portal and no OpenAPI description.
    It does, however, serve a live, entirely anonymous, standards-conformant JSON:API 1.0 surface at https://www.eac.gov/jsonapi,
    generated by Drupal 10 (the `x-generator` response header says so) and hosted on Acquia behind Cloudflare.


    THIS DOCUMENT IS DERIVED BY API EVANGELIST FROM LIVE PROBES, NOT PUBLISHED BY THE EAC. Every path
    below corresponds to a `links` entry in the resource-type index document fetched from https://www.eac.gov/jsonapi
    on 2026-09-06, and every path in this document was individually requested anonymously on that date
    and returned HTTP 200 with `content-type: application/vnd.api+json` AND at least one resource object.
    Resource types the index advertises but which returned an empty `data` array, or which Drupal omitted
    for insufficient authorisation, are recorded in `x-probe.excluded` rather than described here.


    THE SURFACE IS READ-ONLY BY CONFIGURATION. An anonymous `POST /jsonapi/node/article` on 2026-09-06
    returned HTTP 405 with the JSON:API error detail "JSON:API is configured to accept only read operations."
    No write, create, update or delete operation exists on this surface for any caller, credentialed or
    not, so this document describes GET only.


    WHAT IT EXPOSES that is of public interest: the EAC''s voting system certification programme (117
    certified/withdrawn voting systems, 20 registered manufacturers, 8 accredited Voting System Test Laboratories,
    5 testing standards, 275 engineering change orders, 27 Notices of Clarification), the National Voter
    Registration Act state pages (155), state election information and online-voter-registration status
    (113), state voter registration deadlines and lookup links (56), HAVA Election Security and state
    grant financial reporting (56 + 56), 561 Clearinghouse Award entries, 495 news articles and 378 FAQs,
    plus the taxonomies behind them.


    WHAT IT DOES NOT EXPOSE: the Election Administration and Voting Survey (EAVS) microdata. EAVS is distributed
    as bulk CSV/Excel/SPSS/Stata/SAS downloads catalogued in https://www.eac.gov/data.json (Project Open
    Data v1.1), not through this API. `node--jurisdiction_data`, `paragraph--eavs_data` and `taxonomy_term--eavs_states`
    are advertised by the index but return empty collections.'
  contact:
    name: U.S. Election Assistance Commission
    url: https://www.eac.gov/contact
  license:
    name: U.S. Government Work — generally public domain under 17 U.S.C. 105
    url: https://www.eac.gov/main/privacy-statement
  x-derived-by: API Evangelist enrichment pipeline
  x-derived-from: https://www.eac.gov/jsonapi
  x-derived-on: '2026-09-06'
  x-publisher-provided: false
