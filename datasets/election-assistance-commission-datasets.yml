assessment:
  strengths:
  - Valid Project Open Data v1.1 catalog with @context, conformsTo and describedBy declared.
  - Rich keyword vocabulary per dataset (domestic absentee voting, provisional ballots, poll workers,
    voting technology).
  - Covers the EAVS series from 2012 through 2024.
  gaps:
  - Only 11 datasets, and 5 of the 11 are PDF reports rather than data.
  - One entry ("Measuring the Impact of Recent Grants to Election Administrators Under the Help America
    Vote Act") carries the literal identifier "N/A" and two distributions with no format declared — a
    broken record in an otherwise valid catalog.
  - Several distributions declare format as a prose list ("CSV, Excel, SPSS, Stata, SAS") in a single
    string rather than one distribution per format, so a machine cannot select a format.
  - The 2022 EAVS entry declares mediaType text/html — a link to a page, not a dataset.
  - Nothing in the catalog references the live JSON:API at https://www.eac.gov/jsonapi, and nothing in
    the JSON:API references the catalog. The EAC publishes two machine surfaces that do not know about
    each other.
