summary: The EAC serves a real, conformant federal open-data catalog at https://www.eac.gov/data.json
  (HTTP 200, Project Open Data / DCAT-US v1.1). It is the machine index of the bulk data the EAC actually
  wants people to use — above all the Election Administration and Voting Survey (EAVS) microdata, which
  the JSON:API surface does NOT carry. The catalog is not linked from any developer page, is not referenced
  from /.well-known/api-catalog, and is not mentioned on the Research and Data landing page; it is discoverable
  only by knowing the federal convention.
