      - {type: belongs_to, target: taxonomy_term--manufacturer_types, via: field_manufacturer_type, confirmed: false}
      - {type: has_many, target: node--voting_system, via: inverse of field_manufacturer, confirmed: true}
    pii_note: >-
      Carries field_manufacturer_contact and field_job_title naming individuals. Values are not
