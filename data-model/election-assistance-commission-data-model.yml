provider: Election Assistance Commission
providerId: election-assistance-commission
summary: >-
  The entity graph behind the EAC's voting system certification programme, derived from the
  live JSON:API. This is the part of the surface with genuine public value: it is the machine
  form of the certified-voting-systems register, the accredited test-lab list and the
  engineering change order log, joined to the manufacturers and standards they hang off.
  Relationships below were confirmed by side-loading them with ?include= and reading the
  resulting `included` types, not inferred from field names.
identifiers:
  primary: JSON:API resource id — a UUID, stable across the API
  secondary:
    - field: drupal_internal__nid
      note: Drupal node id, present on every node; the integer that appears in legacy /node/NNN URLs.
    - field: drupal_internal__tid
      note: Drupal term id on taxonomy terms.
    - field: drupal_internal__mid
      note: Drupal media id on media entities.
    - field: field_state_code
      note: Two-letter state/territory code on taxonomy_term--states. The only join key to the outside world.
  note: >-
    There are no domain identifiers. A voting system has no EAC certification number field; a
    manufacturer has field_code but no registry identifier a third party could resolve. Joining
    this data to any other election dataset means matching on title strings or state codes.
entities:
  - name: node--voting_system
    label: Certified voting system
    count: 117
    key_attributes:
      - title
      - field_version
      - field_testing_status
      - field_testing_application_date
      - field_application_accepted_date
      - field_certification_date
      - field_withdrawn_decertified_date
      - field_terminated_date
    relationships:
      - {type: belongs_to, target: node--manufacturer, via: field_manufacturer, confirmed: true}
      - {type: belongs_to, target: node--voting_system_test_lab, via: field_testing_lab, confirmed: true}
      - {type: belongs_to, target: node--testing_standard, via: field_testing_standard, confirmed: false}
      - {type: belongs_to, target: taxonomy_term--certification_statuses, via: field_certification_status, confirmed: true}
      - {type: belongs_to, target: taxonomy_term--voting_products, via: field_product, confirmed: false}
      - {type: has_many, target: media--document, via: field_certification_media, confirmed: false}
      - {type: has_many, target: media--document, via: field_test_report_media, confirmed: false}
      - {type: has_many, target: media--document, via: field_advisory_notice_media, confirmed: false}
      - {type: has_many, target: media--document, via: field_correspondence_media, confirmed: false}
      - {type: has_many, target: media--document, via: field_testing_documents_media, confirmed: false}
      - {type: has_many, target: media--document, via: field_termination_document_media, confirmed: false}
      - {type: has_many, target: media--document, via: field_withdrawn_document_media, confirmed: false}
    note: >-
      The document relationships are doubled — field_certification and field_certification_media,
      field_test_report and field_test_report_media, and so on. The `_media` variants point at
      media--document; the unsuffixed ones are the older file-entity fields. A consumer should
      read the `_media` side.
  - name: node--manufacturer
    label: Registered voting system manufacturer
    count: 20
    key_attributes: [title, field_short_title, field_code, field_company_url, field_city, field_zipcode,
      field_manufacturer_application_d, field_manufacturer_approval_date, field_manufacturer_withdrawal_da]
    relationships:
