summary: 'Controlled vocabularies the EAC maintains and serves live over its JSON:API. These are the EAC''s
  own published terms, harvested verbatim from taxonomy_term collections — not a vocabulary API Evangelist
  invented for it. The certification and accreditation vocabularies are the ones with regulatory weight:
  four terms govern the status of every certified voting system in the United States, and two govern every
  accredited test laboratory. The EAC does not publish these anywhere as a vocabulary; they are only reachable
  through the undocumented API.'
