providerId: election-assistance-commission
generated: '2026-09-06'
method: searched
source: >-
  https://www.eac.gov (site-wide search plus JSON:API title filtering for pricing, plan and
  terms pages on 2026-09-06); https://www.eac.gov/jsonapi; https://www.eac.gov/data.json
created: '2026-05-04'
modified: '2026-09-06'
tags:
  - Federal Government
  - Elections
  - Voting
  - Open Data
description: >-
  The U.S. Election Assistance Commission publishes no plans, no pricing, no tiers and no
  metered API product. Everything it serves over HTTP — the JSON:API content surface at
  /jsonapi, the Project Open Data catalog at /data.json, the RSS feed, and every EAVS bulk
  download — is free, anonymous and uncapped by policy. This is the correct posture for a
  federal agency publishing public records under HAVA, and an honest zero rather than an
  absence of measurement.
plan_count: 0
plans: []
pricing_model: none
free_access:
  available: true
  authentication_required: false
  registration_required: false
  cost: 0
  note: >-
    No API key, no account, no sign-up and no rate tier exists. Anonymous GET returns HTTP 200.
probes:
  - url: https://www.eac.gov/jsonapi
    status: 200
    finding: Anonymous read, no plan or quota mechanism of any kind.
  - url: https://www.eac.gov/data.json
    status: 200
    finding: Open data catalog, accessLevel public, free download.
  - url: https://www.eac.gov/developers
    status: 404
    finding: No developer portal exists, therefore no pricing page exists.
  - url: https://www.eac.gov/api
    status: 404
    finding: No API landing page.
supersedes: >-
  This file previously contained a three-tier free/professional/enterprise pricing scaffold
  written by the 2026-05-04 bulk sweep (method: generated) with invented request quotas and
  a "custom" enterprise price. None of it was ever published by the EAC. It is replaced here
  by the measured result.
