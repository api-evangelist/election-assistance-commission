apis:
- aid: election-assistance-commission:eac
  name: EAC Content JSON:API
  description: 'A live, anonymous, read-only JSON:API 1.0 surface served by the EAC''s own Drupal
    10 web platform at https://www.eac.gov/jsonapi. The EAC does not document, advertise or link to
    it from any developer page, and it has no developer portal — but the surface is real: probed 2026-09-06,
    the resource index returned HTTP 200 with 216 entity--bundle link relations, 210 of which answered
    with application/vnd.api+json and 86 of which returned substantive records. It carries the machine
    form of the EAC''s regulatory estate — 117 voting systems in the Testing and Certification Program,
    8 accredited Voting System Test Laboratories, 20 registered manufacturers, 5 VVSG testing standards,
    275 Engineering Change Orders, 27 Notices of Clarification, 155 NVRA state pages, 113 state election
    information records, 56 per-state registration and voting records, HAVA Election Security and
    state grant financials, and 561 Clearinghouse Award entries. It is read-only by site configuration:
    every write verb returns HTTP 405 "JSON:API is configured to accept only read operations". No
    key, no account, no OAuth. The OpenAPI description in this repository was DERIVED BY API EVANGELIST
    from those live probes; the EAC publishes none.'
