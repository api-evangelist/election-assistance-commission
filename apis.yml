apis:
- aid: election-assistance-commission:data-catalog
  name: EAC Open Data Catalog
  description: >-
    The EAC's federal open-data inventory, served at https://www.eac.gov/data.json and declaring conformance
    to the Project Open Data / DCAT-US v1.1 schema in the document itself. Probed 2026-09-06: HTTP 200,
    11 datasets, chiefly the Election Administration and Voting Survey (EAVS) series from 2012 through
    2024 plus EAC research reports. This is where the EAVS microdata lives — it is NOT carried by the
    JSON:API surface, whose EAVS-named resource types return empty collections. The catalog is not linked
    from any EAC developer or data page and is not referenced from a /.well-known/api-catalog; it is discoverable
    only by knowing the federal /data.json convention.
