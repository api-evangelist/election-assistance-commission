aid: election-assistance-commission
name: Election Assistance Commission
description: 'The U.S. Election Assistance Commission (EAC) is an independent, bipartisan federal
  commission established by the Help America Vote Act of 2002 (HAVA). It adopts the Voluntary Voting
  System Guidelines, accredits voting system test laboratories, certifies voting systems, administers
  and audits HAVA grant funds, and is the national clearinghouse for election administration information.
  The EAC publishes no developer portal, no API documentation and no API key programme, but serves
  two real anonymous machine surfaces it does not advertise: a live read-only JSON:API 1.0 at https://www.eac.gov/jsonapi
  (Drupal 10, 216 resource types) carrying the certified voting system register, accredited test labs,
  manufacturers, Engineering Change Orders, Notices of Clarification, NVRA state pages, per-state
  registration deadlines, HAVA grant financials and 561 Clearinghouse Awards; and a Project Open Data
  v1.1 catalog at https://www.eac.gov/data.json listing the EAVS bulk datasets. Both verified.'
