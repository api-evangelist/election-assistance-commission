- path: /.well-known/security.txt
  status: 404
  note: The EAC does publish a full vulnerability disclosure policy at https://www.eac.gov/vulnerability-disclosure-policy
    (HTTP 200) — CISA BOD 20-01 shaped, with scope, authorization, a 45-day disclosure window and a reporting
    form. It is simply not advertised at the RFC 9116 path, so no machine can find it. This is the single
    cheapest machine-discoverability fix available to the EAC.
